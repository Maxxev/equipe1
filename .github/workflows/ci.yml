name: CI Laravel

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Vérifier le formatage avec Pint
        run: ./vendor/bin/pint --test

  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Analyse statique PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  tests:
    runs-on: ubuntu-latest
    needs: [ lint, analyse ]
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_mysql, mbstring, bcmath, zip
          coverage: xdebug

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist

      - name: Préparer le .env de test
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Tests avec couverture HTML
        run: php artisan test --coverage-html reports/coverage

      - name: Publier le rapport de couverture
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage
