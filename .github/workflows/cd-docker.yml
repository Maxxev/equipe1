name: CD Docker

on:
  workflow_run:
    workflows: ["CI Laravel"]
    types: [completed]
    branches: [main, 33-tester-le-deploiement-continu]   # TEMPORAIRE - ajout de la branche de test
  push:                                   # TEMPORAIRE - permet de tester sans attendre
    branches: [33-tester-le-deploiement-continu]          # que le fichier soit sur main

jobs:
  deploy-docker:
    name: Déploiement sur le serveur de staging (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Le déclencheur push (temporaire) n'a pas de contexte workflow_run,
    # donc on ne vérifie sa conclusion que lorsque l'événement est workflow_run.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'

    # Groupe différent de celui de cd-bare-metal.yml : les deux variantes ne
    # se bloquent jamais entre elles.
    concurrency:
      group: deploy-staging-docker
      cancel-in-progress: false

    environment:
      name: staging-docker
      url: ${{ vars.APP_URL_DOCKER }}

    steps:
      - name: Installer la clé SSH du robot
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Vérifier la connexion au serveur
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'echo "Connecté sur $(hostname) en tant que $(whoami)"'

      - name: Lancer le déploiement Docker
        run: |
          # SSH_USER vaut déjà "deploy" : pas de "sudo -u deploy" ici,
          # contrairement aux commandes tapées à la main en tant qu'azureuser.
          # scripts/deploy-docker.sh gère lui-même les `-f docker-compose.yml -f docker-compose.staging.yml` en interne.
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd ${{ vars.APP_DIR_DOCKER }} && ./scripts/deploy-docker.sh ${{ github.event.workflow_run.head_sha }}"

      - name: Smoke test - la route /health (Docker)
        env:
          SHA_ATTENDU: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -uo pipefail
          URL="${{ vars.APP_URL_DOCKER }}/health"
          CODE=000

          # Le conteneur "app" vient d'être recréé (up -d) : on laisse
          # jusqu'à 60 s.
          for tentative in $(seq 1 12); do
            CODE=$(curl -sS -o health.json -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            echo "Tentative $tentative - HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done

          echo "--- Réponse de $URL ---"
          cat health.json || true
          echo

          if [ "$CODE" != "200" ]; then
            echo "::error::/health (Docker) a répondu $CODE au lieu de 200"
            exit 1
          fi

          STATUT=$(jq -r '.status' health.json)
          if [ "$STATUT" != "ok" ]; then
            echo "::error::/health (Docker) renvoie status=$STATUT"
            jq -r '.checks' health.json
            exit 1
          fi

          EN_LIGNE=$(jq -r '.version' health.json)
          if [ "$EN_LIGNE" != "$SHA_ATTENDU" ]; then
            echo "::error::Version Docker en ligne = $EN_LIGNE, attendue = $SHA_ATTENDU"
            exit 1
          fi

          echo "Smoke test Docker réussi - commit ${SHA_ATTENDU:0:8} confirmé en ligne."

      - name: Smoke test - la page d'accueil et la redirection HTTPS (Docker)
        run: |
          set -uo pipefail
          BASE="${{ vars.APP_URL_DOCKER }}"

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/")
          echo "GET $BASE/ -> $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Accueil Docker HTTP $CODE"; exit 1; }

          REDIR=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${BASE/https:/http:}/")
          echo "GET en clair -> $REDIR"
          case "$REDIR" in
            301|308) echo "Redirection HTTP -> HTTPS confirmée (Docker)" ;;
            *) echo "::warning::Redirection Docker inattendue : $REDIR" ;;
          esac

      - name: Résumé du déploiement (Docker)
        if: always()
        env:
          MESSAGE_COMMIT: ${{ github.event.workflow_run.head_commit.message }}
          AUTEUR: ${{ github.event.workflow_run.actor.login }}
          URL_APP: ${{ vars.APP_URL_DOCKER }}
          RESULTAT: ${{ job.status }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "### Déploiement staging (Docker)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${SHA:0:8}\` |"
            echo "| Message | ${MESSAGE_COMMIT%%$'\n'*} |"
            echo "| Auteur | $AUTEUR |"
            echo "| URL | $URL_APP |"
            echo "| Résultat | $RESULTAT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Effacer la clé SSH du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
