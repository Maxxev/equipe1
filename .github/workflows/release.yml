name: Release

on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci # installe les dépendances, mais fail si le package-lock.json ne colle pas avec le package.json
      - run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
      - run: npx release-it --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
