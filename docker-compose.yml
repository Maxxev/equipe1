services:
    app: # nom du service (choix libre)
        build: # utiliser le dockerfile
            context: .
            dockerfile: docker/Dockerfile
            args:
                WWWUSER: ${WWWUSER:-1000}
                WWWGROUP: ${WWWGROUP:-1000}
        volumes:
            - .:/var/www/html # code source monté
            - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.ini
        networks:
            - laravel

    nginx:
        image: nginx:alpine
        ports:
            - "127.0.0.1:8001:80" # port hôte:port conteneur — localhost seulement (voir docker-compose.staging.yml)
        volumes:
            - .:/var/www/html
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app # démarre après app
        networks:
            - laravel

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - mysql_data:/var/lib/mysql # volume nommé pour persister les données
        networks:
            - laravel
    phpmyadmin:
        image: phpmyadmin:latest
        environment:
            PMA_HOST: mysql
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
        ports:
            - "127.0.0.1:8080:80" # localhost seulement
        depends_on:
            - mysql
        networks:
            - laravel

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        working_dir: /app
        volumes:
            - .:/app
            - ~/.ssh:/root/.ssh:ro
        entrypoint: ["tail", "-f", "/dev/null"]
        networks:
            - laravel
        environment:
            GITHUB_TOKEN: ${GITHUB_TOKEN}

volumes:
    mysql_data: # volume nommé déclaré ici

networks:
    laravel: # réseau interne entre les services
