server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 24M;

    # En staging, ce nginx est DERRIÈRE le nginx de l'hôte (TLS + proxy_pass
    # vers 127.0.0.1:8001, voir la fiche 4 §0bis). Sans ces deux lignes,
    # Laravel croirait que toutes les requêtes viennent de l'hôte en HTTP,
    # et générerait des URL en http:// (contenu mixte). Inoffensif en dev
    # local : sans en-tête X-Forwarded-For, l'IP réelle est utilisée telle quelle.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /health {
        try_files $uri /index.php?$query_string;
        add_header Cache-Control "no-store" always;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Indispensable derrière le proxy de l'hôte : dit à Laravel que la
        # requête d'origine était en HTTPS.
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }

    location ~ /\. {
        deny all;
    }
}
